# 所有环境通用配置
# YAML注释，以#开头
# 说明这个文件包含所有环境（开发、测试、生产等）都会使用的通用配置

app:
# 应用程序配置部分
# 定义应用的元数据信息
# 这是一个层级结构，app是顶层键

  name: "my-test-framework"
  # 应用名称
  # 定义了当前测试框架的名称为"my-test-framework"
  # 引号可选，但包含特殊字符时建议使用

  version: "0.1.0"
  # 应用版本号
  # 遵循语义化版本规范
  # 当前版本为0.1.0（初始开发版本）

http:
# HTTP客户端配置部分
# 所有HTTP请求相关的配置

  base_url: "https://api.example.com"  # 请求的基础URL
  # HTTP请求的基础URL地址
  # 所有相对路径的请求都会基于此URL拼接
  # 行内注释说明了该配置的用途
  # 这是一个示例地址，实际使用时会替换

  timeout: 30
  # 请求超时时间（秒）
  # HTTP请求的最长等待时间
  # 30秒后如果未响应则超时

  retry_count: 3
  # 重试次数
  # 当请求失败时的最大重试次数
  # 这里设置为3次（总共尝试4次）

logging:
# 日志配置部分
# 控制日志记录的行为

  level: INFO
  # 日志级别
  # INFO表示记录信息级别及以上的日志
  # 其他级别：DEBUG, INFO, WARNING, ERROR, CRITICAL

  format: json
  # 日志输出格式
  # json表示以JSON格式输出日志
  # 便于日志收集和分析工具（如ELK）处理