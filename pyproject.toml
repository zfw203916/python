[project]
name = "fastapi-demo"
version = "1.0.0"
description = "FastAPI + PostgreSQL + Redis + SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "pydantic[email]>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=2.53.0",
    "streamlit>=1.61.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "asyncpg==0.29.0",
    "requests>=2.34.2",
    "jsonpath>=0.82.2",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "locust>=2.46.3",
    "behave==1.2.6",
    "behave-html-formatter>=0.9.10",
    "faker>=40.36.0",
    "matplotlib>=3.11.1",
    "pgvector>=0.5.0",
    "python-multipart>=0.0.32",
    "aiohttp>=3.14.3",
    "pypdf>=6.16.2",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    "langchain-core>=1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
