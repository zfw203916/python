[project]
name = "fastapi-demo"
version = "1.0.0"
description = "FastAPI + PostgreSQL + Redis + SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "pydantic[email]>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=2.53.0",
    "streamlit>=1.61.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "asyncpg==0.29.0",
    "requests>=2.34.2",
    "jsonpath>=0.82.2",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "locust>=2.46.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
