# Docker Compose 配置文件
# 定义所有服务：PostgreSQL、Redis、FastAPI应用

version: '3.8'

services:
  # ============ PostgreSQL 数据库服务 ============
  postgres:
    image: postgres:15-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_pass
      POSTGRES_DB: fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ Redis 缓存服务 ============
  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ FastAPI 应用服务 ============
  app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fastapi_user:fastapi_pass@postgres:5432/fastapi_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
    networks:
      - fastapi_network
    # 开发模式：热重载
    command: >
      sh -c "uv run uvicorn src.app.fastapi_demo.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:

networks:
  fastapi_network: