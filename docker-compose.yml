# Docker Compose 配置文件
# 定义所有服务：PostgreSQL、Redis、FastAPI应用



services:
  # ============ PostgreSQL 数据库服务 ============
  postgres:
    image: pgvector/pgvector:pg15 
    container_name: fastapi_postgres
    environment:
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_pass
      POSTGRES_DB: fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ Redis 缓存服务 ============
  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ FastAPI 应用服务 ============
  app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fastapi_user:fastapi_pass@postgres:5432/fastapi_db
      #DATABASE_URL = postgresql://postgres:postgres@localhost:5432/ai_companion
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      APP_ENV: development
      APP_DEEPSEEK_URL: ${APP_DEEPSEEK_URL}
      APP_DEEPSEEK_API_KEY: ${APP_DEEPSEEK_API_KEY} 
      add_middleware_secret_key: ${add_middleware_secret_key}
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
    networks:
      - fastapi_network
    # 开发模式：热重载
    command: sh -c "uvicorn src.framework.ai.aicompanion_v2.main:app --host 0.0.0.0 --port 8000 --reload"

  # ============ Qdrant 向量数据库服务 ============
  qdrant:
    image: qdrant/qdrant
    container_name: fastapi_qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=qdrant123456
    ports:
      - "6333:6333" # REST API / Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_storage:

networks:
  fastapi_network: