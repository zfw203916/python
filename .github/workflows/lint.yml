# 代码检查流水线
name : Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      
      - name: Install dependencies
        run: uv sync --all-groups
      
      - name: Run Ruff
        run: uv run ruff check src tests
      
      - name: Run mypy
        run: uv run mypy src tests